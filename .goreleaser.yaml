version: 2

project_name: git-janitor

before:
  hooks:
    - go mod tidy

# Two binaries are built from the same source:
#   - `git-janitor`: the canonical name. Because it starts with "git-", git also runs it as `git janitor`.
#   - `gj`: a short alias for quick typing.
# Both are included in the archives, the Scoop manifest and the deb/rpm/apk packages automatically.
builds:
  - id: git-janitor
    main: .
    binary: git-janitor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/vhjan/git-janitor/internal/buildinfo.Version={{.Version}}
      - -X github.com/vhjan/git-janitor/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/vhjan/git-janitor/internal/buildinfo.Date={{.Date}}

  - id: gj
    main: .
    binary: gj
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/vhjan/git-janitor/internal/buildinfo.Version={{.Version}}
      - -X github.com/vhjan/git-janitor/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/vhjan/git-janitor/internal/buildinfo.Date={{.Date}}

universal_binaries:
  - id: git-janitor
    ids: [git-janitor]
    replace: true
  - id: gj
    ids: [gj]
    replace: true

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: 'checksums.txt'

nfpms:
  - vendor: vhjan
    homepage: "https://github.com/vhjan/git-janitor"
    maintainer: "Jan Van Herck"
    description: "A fast, interactive TUI for cleaning up local Git branches."
    license: MIT
    formats:
      - deb
      - rpm
      - apk

# Homebrew is handled separately in .github/workflows/release.yml

scoops:
  - repository:
      owner: vhjan
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/vhjan/git-janitor"
    description: "A fast, interactive TUI for cleaning up local Git branches."
    license: MIT

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^Merge pull request"

release:
  github:
    owner: vhjan
    name: git-janitor
  footer: |
    ## How to Update
    
    If you already have Git Janitor installed, you can update to this version using your package manager:
    
    **macOS / Linux (Homebrew)**
    ```bash
    brew upgrade vhjan/tap/git-janitor
    ```
    
    **Windows (Scoop)**
    ```bash
    scoop update git-janitor
    ```
    
    **Go Users**
    ```bash
    go install github.com/vhjan/git-janitor@latest
    ```
    
    *First time installing? Check out the [full installation guide](https://github.com/vhjan/git-janitor#installation) in the README.*
